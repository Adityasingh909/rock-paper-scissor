<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Rock Paper Scissor</h1>
        <div class="boxes">
            <div class="rock boxe">
                <img src="rock.png" alt="rock">
            </div>
            <div class="Paper boxe">
                <img src="paper.png" alt="paper">
            </div>
            <div class="Scissor boxe">
                <img src="scissors.png" alt="scissors">
            </div>
        </div>
        <div class="score">

            <div class="user1">Your Score : 0</div>
            <div class="user2">Comp Score : 0</div>
        </div>
        <div class="move">Pick your move</div>
</div>
    <script src="script.js"></script>
</body>
</html>
